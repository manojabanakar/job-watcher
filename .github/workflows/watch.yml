name: Job Watcher

on:
  schedule:
    # Every 15 minutes (UTC). GitHub may start scheduled runs a few minutes late.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal = real run, test = send one test push, dry = print only"
        required: true
        default: normal
        type: choice
        options: [normal, test, dry]

permissions:
  contents: write   # needed to save seen.json back to the repo

concurrency:
  group: job-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          MODE="${{ github.event.inputs.mode || 'normal' }}"
          if [ "$MODE" = "test" ]; then
            python watcher.py --test-notify
          elif [ "$MODE" = "dry" ]; then
            python watcher.py --dry-run
          else
            python watcher.py
          fi

      - name: Save seen jobs
        if: ${{ github.event_name == 'schedule' || github.event.inputs.mode == 'normal' }}
        run: |
          git config user.name "job-watcher-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          if git diff --cached --quiet; then
            echo "No new jobs to save."
          else
            git commit -m "Update seen jobs [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
