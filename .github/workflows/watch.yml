name: Job Watcher

on:
  schedule:
    # Every 15 minutes (UTC). GitHub may start scheduled runs a few minutes late.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal = real run, test = send one test push, dry = print only"
        required: true
        default: normal
        type: choice
        options: [normal, test, dry]

permissions:
  contents: write   # needed to save seen.json back to the repo

concurrency:
  group: job-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          # Latest main, not the commit at trigger time: a run that waited in
          # the queue must see the jobs the previous run already alerted.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          MODE="${{ github.event.inputs.mode || 'normal' }}"
          if [ "$MODE" = "test" ]; then
            python watcher.py --test-notify
          elif [ "$MODE" = "dry" ]; then
            python watcher.py --dry-run
          else
            python watcher.py
          fi

      - name: Save seen jobs
        if: ${{ github.event_name == 'schedule' || github.event.inputs.mode == 'normal' }}
        run: |
          git config user.name "job-watcher-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep this run's results, then merge them into whatever is on
          # GitHub now (another run may have saved in the meantime).
          mkdir -p /tmp/ours
          cp seen.json /tmp/ours/seen.json
          [ -f state.json ] && cp state.json /tmp/ours/state.json || echo '{}' > /tmp/ours/state.json
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python merge_state.py /tmp/ours/seen.json /tmp/ours/state.json
            git add seen.json state.json
            if git diff --cached --quiet; then
              echo "Nothing new to save."
              exit 0
            fi
            git commit -q -m "Update seen jobs and search times [skip ci]"
            if git push -q origin HEAD:main; then
              echo "Saved on attempt $attempt."
              exit 0
            fi
            echo "Push raced with another run, retrying..."
            sleep $((attempt * 5))
          done
          echo "Could not save after 5 attempts."
          exit 1
